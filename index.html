<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>退休目標追蹤</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#fff;--bg2:#f5f5f5;--bg3:#ececec;--bg4:#e0e0e0;
  --text:#111;--text2:#555;--text3:#999;
  --border:#e2e2e2;--border2:#ccc;
  --green:#097A4A;--green-bg:#C5F0DC;--green-text:#054028;
  --red:#C0291A;--red-bg:#FDDDD9;--red-text:#7a1810;
  --blue:#1252A3;--blue-bg:#C8E0F8;--blue-text:#0a3572;
  --yellow:#7A4500;--yellow-bg:#FDDDB8;--yellow-text:#4a2800;
  --purple-bg:#EAE8FD;--purple-text:#2D2080;
  --radius:6px;--radius-lg:10px;--radius-xl:14px;
  --shadow:0 1px 4px rgba(0,0,0,.07)
}
@media(prefers-color-scheme:dark){:root{
  --bg:#0f1621;--bg2:#161e2c;--bg3:#1d2840;--bg4:#253350;
  --text:#f2f2f2;--text2:#8fa3bc;--text3:#4e6180;
  --border:#1c2b3f;--border2:#283d58;
  --green:#2ecc8a;--green-bg:#053d28;--green-text:#5eefb2;
  --red:#e85d4a;--red-bg:#3d0f09;--red-text:#f9a49b;
  --blue:#4d9ef5;--blue-bg:#112a52;--blue-text:#8ec5fa;
  --yellow:#f5a623;--yellow-bg:#3d1f00;--yellow-text:#fdd08a;
  --purple-bg:#1e1560;--purple-text:#b5aaff;
}}
body{font-family:'Noto Sans JP',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg2);color:var(--text);font-size:14px;line-height:1.5;min-height:100vh}
input,select{font-family:inherit;font-size:12px;padding:6px 9px;border:0.5px solid var(--border2);border-radius:var(--radius);background:var(--bg);color:var(--text);outline:none;width:100%}
input:focus,select:focus{border-color:var(--blue);box-shadow:0 0 0 2px rgba(24,95,165,.12)}
button{font-family:inherit;cursor:pointer;transition:all .12s;background:var(--bg);border:0.5px solid var(--border2);color:var(--text2);padding:5px 12px;border-radius:var(--radius);font-size:12px;white-space:nowrap}
button:hover{background:var(--bg2);color:var(--text)}
.btn{background:var(--bg);border:0.5px solid var(--border2);color:var(--text);padding:6px 13px;border-radius:var(--radius);font-size:12px}
.btn:hover{background:var(--bg2)}
.btn-blue{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:500}
.btn-blue:hover{filter:brightness(1.08)}
.btn-red{background:none;border:0.5px solid var(--red);color:var(--red);padding:4px 9px;border-radius:var(--radius);font-size:11px}
.btn-red:hover{background:var(--red-bg)}
.btn-sm{background:none;border:0.5px solid var(--border);color:var(--text2);padding:3px 8px;border-radius:var(--radius);font-size:11px}
.btn-sm:hover{border-color:var(--border2);color:var(--text)}
#hd{display:flex;justify-content:space-between;align-items:center;padding:10px 20px;border-bottom:0.5px solid var(--border);background:var(--bg);position:sticky;top:0;z-index:100;gap:10px}
#hd h1{font-size:14px;font-weight:500;display:flex;align-items:center;gap:8px;letter-spacing:.05em}
.dot{width:7px;height:7px;border-radius:50%;background:var(--green);flex-shrink:0}
.hr{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ai{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text2)}
.ai input{width:80px;padding:4px 7px;font-size:11px}
nav{display:flex;border-bottom:0.5px solid var(--border);padding:0 20px;overflow-x:auto;background:var(--bg);position:sticky;top:45px;z-index:99}
.tab{padding:9px 14px;background:none;border:none;border-bottom:2px solid transparent;font-size:11px;color:var(--text2);cursor:pointer;white-space:nowrap;letter-spacing:.06em}
.tab.active{color:var(--blue);border-bottom-color:var(--blue);font-weight:500}
main{padding:0;width:100%}
/* KPI strip */
.kpi-strip{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border-bottom:0.5px solid var(--border);background:var(--bg);width:100%}
.kpi-cell{padding:12px 20px;border-right:0.5px solid var(--border);min-height:80px}
.kpi-cell:last-child{border-right:none}
/* 2-col dash layout */
.dash-layout{display:grid;grid-template-columns:220px 1fr 300px;min-height:400px;width:100%}
@media(max-width:1200px){.dash-layout{grid-template-columns:220px 1fr}}
@media(max-width:900px){.dash-layout{grid-template-columns:1fr}}
.dash-left{padding:14px 16px;border-right:0.5px solid var(--border);background:var(--bg);display:flex;flex-direction:column;gap:14px}
.dash-right{padding:12px 14px;background:var(--bg2);display:flex;flex-direction:column;gap:10px;min-height:calc(100vh - 90px)}
/* full page areas */
.page-body{padding:16px;background:var(--bg2);display:flex;flex-direction:column;gap:12px;min-height:calc(100vh - 90px)}
/* stat list */
.stat-group-label{font-size:9px;letter-spacing:.18em;color:var(--text3);text-transform:uppercase;margin-bottom:8px;font-weight:500}
.stat-row{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0;border-bottom:0.5px solid var(--border)}
.stat-row:last-child{border-bottom:none}
.stat-label{font-size:11px;color:var(--text2)}
.stat-val{font-size:13px;font-weight:600;font-family:ui-monospace,monospace}
/* account mini cards */
.acc-list{display:flex;flex-direction:column;gap:5px}
.acc-item{border-radius:var(--radius);padding:6px 10px;display:flex;justify-content:space-between;align-items:center;border:0.5px solid var(--border)}
.acc-item.total{border-top:1px solid var(--border2);margin-top:4px;padding-top:8px;border:none;background:none}
.acc-name{font-size:11px;color:var(--text2)}
.acc-val{font-size:13px;font-weight:700;font-family:ui-monospace,monospace;color:var(--text)}
/* progress */
.prog-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px}
.prog-title{font-size:11px;color:var(--text2)}
.prog-pct{font-size:15px;font-weight:700;font-family:ui-monospace,monospace;color:var(--blue)}
.prog-bar{height:6px;background:var(--bg3);border-radius:3px;overflow:hidden;margin-bottom:6px}
.prog-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--blue),#1D9E75)}
.prog-note{font-size:10px;color:var(--text3);letter-spacing:.03em}
/* cards (legacy compat + new) */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.card{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--radius-lg);padding:12px 14px;box-shadow:var(--shadow)}
.cl{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.12em;margin-bottom:6px}
.cv{font-size:20px;font-weight:700;font-family:ui-monospace,monospace;line-height:1.1}
.cs{font-size:10px;color:var(--text3);margin-top:4px}
.cv.pos{color:var(--green)}.cv.neg{color:var(--red)}
/* sections */
.panel{border:0.5px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;background:var(--bg);box-shadow:var(--shadow)}
.ph{padding:9px 14px;background:var(--bg);font-size:10px;font-weight:500;color:var(--text2);text-transform:uppercase;letter-spacing:.1em;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;border-bottom:0.5px solid var(--border)}
.sx{overflow-x:auto}.sy{max-height:460px;overflow-y:auto}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;padding:8px 12px;font-size:10px;font-weight:500;color:var(--text2);border-bottom:0.5px solid var(--border);background:var(--bg3);white-space:nowrap;cursor:pointer;user-select:none;position:sticky;top:0;z-index:1;letter-spacing:.1em;text-transform:uppercase}
th:hover{color:var(--text);background:var(--bg3)}
th.sa::after{content:' ↑';color:var(--blue)}th.sd::after{content:' ↓';color:var(--blue)}
td{padding:8px 12px;border-bottom:0.5px solid var(--border);vertical-align:middle}
td.pos,td.neg{font-weight:600}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--bg3)}
.num{font-family:ui-monospace,monospace;text-align:right;white-space:nowrap}
.pos{color:var(--green);font-weight:700}.neg{color:var(--red);font-weight:700}.neu{color:var(--text2)}
.num.pos,.num.neg{font-weight:700}
/* badges */
.badge{display:inline-block;padding:2px 7px;border-radius:3px;font-size:10px;font-weight:500;white-space:nowrap;letter-spacing:.04em}
.bb{background:var(--blue-bg);color:var(--blue-text)}
.bs{background:var(--red-bg);color:var(--red-text)}
.bd{background:var(--green-bg);color:var(--green-text)}
.bi{background:var(--yellow-bg);color:var(--yellow-text)}
.br{background:var(--bg3);color:var(--text2)}
.bgt{background:var(--green-bg);color:var(--green-text);font-weight:600}
.bft{background:var(--blue-bg);color:var(--blue-text);font-weight:600}
.bsw{background:var(--yellow-bg);color:var(--yellow-text);font-weight:600}
/* forms */
.fb{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--radius-lg);padding:14px;margin-bottom:14px;box-shadow:var(--shadow)}
.fg{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.fl{font-size:10px;color:var(--text3);margin-bottom:3px;text-transform:uppercase;letter-spacing:.1em}
.fh{font-size:11px;color:var(--text2);margin-top:8px;padding:7px 10px;background:var(--bg2);border-radius:var(--radius)}
.filter-bar{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.chip{padding:3px 10px;border-radius:999px;font-size:11px;border:0.5px solid var(--border2);background:none;color:var(--text2);cursor:pointer;letter-spacing:.04em}
.chip.active{background:var(--blue-bg);color:var(--blue);border-color:var(--blue)}
/* buttons */
.ubtn{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:var(--radius);font-size:11px;background:var(--bg);border:0.5px solid var(--border2);color:var(--text);cursor:pointer;font-family:inherit;white-space:nowrap}
.ubtn:hover{background:var(--bg2)}
.ubtn.loading{opacity:.65;cursor:wait;pointer-events:none}
.spin{width:11px;height:11px;border:1.5px solid var(--border2);border-top-color:var(--blue);border-radius:50%;animation:sp .7s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.bw{height:4px;background:var(--bg3);border-radius:2px;margin-top:3px;overflow:hidden}
.bv{height:100%;border-radius:2px;background:var(--blue)}
/* toast */
.toast{position:fixed;bottom:20px;right:20px;background:var(--text);color:var(--bg);padding:9px 16px;border-radius:var(--radius-lg);font-size:12px;z-index:9999;opacity:0;transform:translateY(8px);transition:all .22s;pointer-events:none;max-width:340px}
.toast.show{opacity:1;transform:translateY(0)}
.si{padding:5px 9px;font-size:12px;border:0.5px solid var(--border2);border-radius:var(--radius);background:var(--bg);color:var(--text);outline:none;width:150px}
/* legacy layout compat */
.cw{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}
@media(max-width:700px){.cw{grid-template-columns:1fr}}
.cc{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--radius-lg);padding:14px}
.ct{font-size:10px;font-weight:500;color:var(--text3);text-transform:uppercase;letter-spacing:.12em;margin-bottom:10px}
.li{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text2);padding:3px 0}
.ld{width:8px;height:8px;border-radius:2px;flex-shrink:0}
.sb{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--radius-lg);padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.sb h3{font-size:12px;font-weight:500;margin-bottom:9px}
.ib{background:var(--blue-bg);border-radius:var(--radius);padding:9px 11px;font-size:11px;color:var(--blue);margin-top:7px;line-height:1.7}
.wb{background:var(--yellow-bg);border-radius:var(--radius);padding:9px 11px;font-size:11px;color:var(--yellow);margin-top:7px;line-height:1.7}
.kr{display:flex;gap:8px}.kr input{flex:1}
#cash-panel.open{display:block!important}
@media(max-width:600px){main{padding:12px}#hd{padding:10px 14px}.ai{display:none}.cards{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div id="hd">
  <div style="display:flex;align-items:center;gap:9px">
    <span class="dot"></span>
    <div>
      <div style="font-size:13px;font-weight:500;letter-spacing:.06em;color:var(--text)">退休目標追蹤</div>
      <div style="font-size:9px;color:var(--text3);letter-spacing:.18em;margin-top:1px">RETIREMENT TRACKER</div>
    </div>
  </div>
  <div class="hr">
    <span id="ss" style="font-size:10px;color:var(--text3);letter-spacing:.06em"></span>
    <div class="ai"><span style="color:var(--text3);font-size:10px;letter-spacing:.06em">USD/TWD</span><input type="number" id="ir" step="0.001" onchange="onAcc('rate',this.value)" style="width:68px"></div>
    <div style="position:relative">
      <button onclick="document.getElementById('cash-panel').classList.toggle('open')" title="由交易紀錄自動計算">💰 現金餘額 ▾</button>
      <div id="cash-panel" style="display:none;position:absolute;right:0;top:36px;background:var(--bg);border:0.5px solid var(--border2);border-radius:var(--radius-lg);padding:14px 16px;z-index:200;min-width:280px;box-shadow:0 4px 20px rgba(0,0,0,.1)">
        <div style="font-size:10px;color:var(--text3);letter-spacing:.14em;text-transform:uppercase;margin-bottom:10px">帳戶現金（交易自動計算）</div>
        <div style="font-size:10px;color:var(--text3);margin-bottom:6px;display:grid;grid-template-columns:80px 90px 80px;gap:4px;text-align:center"><span></span><span>自動計算</span><span>手動調整</span></div>
        <div style="display:grid;grid-template-columns:80px 90px 80px;gap:4px;align-items:center;margin-bottom:6px"><span style="font-size:11px;color:var(--text2)">Firstrade</span><input type="number" id="ic-ft" readonly style="opacity:0.5;cursor:default;font-size:11px"><input type="number" id="ic-ft-adj" step="0.01" placeholder="±0" style="font-size:11px" onchange="onCashAdj('FT',this.value)" value="0"></div>
        <div style="display:grid;grid-template-columns:80px 90px 80px;gap:4px;align-items:center;margin-bottom:6px"><span style="font-size:11px;color:var(--text2)">嘉信</span><input type="number" id="ic-sw" readonly style="opacity:0.5;cursor:default;font-size:11px"><input type="number" id="ic-sw-adj" step="0.01" placeholder="±0" style="font-size:11px" onchange="onCashAdj('Schwab',this.value)" value="0"></div>
        <div style="display:grid;grid-template-columns:80px 90px 80px;gap:4px;align-items:center"><span style="font-size:11px;color:var(--text2)">國泰複委托</span><input type="number" id="ic-ct" readonly style="opacity:0.5;cursor:default;font-size:11px"><input type="number" id="ic-ct-adj" step="0.01" placeholder="±0" style="font-size:11px" onchange="onCashAdj('GT',this.value)" value="0"></div>
      </div>
    </div>
    <button class="btn-blue" onclick="doExport()">↓ 匯出</button>
  </div>
</div>
<nav>
  <button class="tab" data-tab="dash">總覽</button>
  <button class="tab" data-tab="holdings">持倉</button>
  <button class="tab" data-tab="tx">交易</button>
  <button class="tab" data-tab="fx">出入金</button>
  <button class="tab" data-tab="settings">設定</button>
</nav>
<main id="main"></main>
<div class="toast" id="toast"></div>
<input type="file" id="fsv-file" accept=".fsv,.csv,.txt" style="display:none" onchange="onFSVFile(this)">
<input type="file" id="schwab-file" accept=".csv,.txt" style="display:none" onchange="onSchwabFile(this)">
<input type="file" id="imp" accept=".json" style="display:none" onchange="importJSON(this)">

<script>
// ─── UTILS ───
const d2s=s=>isNaN(s)||!s?"":new Date((s-25569)*86400000).toISOString().slice(0,10);
const gid=()=>Date.now()+"-"+Math.random().toString(36).slice(2,6);
const fn=(n,d=2)=>(n||0).toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d});
const fp=n=>((n||0)*100).toFixed(2)+"%";
const cv=v=>v>0?"pos":v<0?"neg":"neu";
const today=()=>new Date().toISOString().slice(0,10);
const esc=s=>String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
let toastTimer;
function toast(msg,ms){
  ms=ms||2800;
  var el=document.getElementById("toast");
  el.textContent=msg;el.classList.add("show");
  clearTimeout(toastTimer);toastTimer=setTimeout(function(){el.classList.remove("show")},ms);
}
function annualReturn(cost,price,fd){
  if(!fd||!cost||cost===0)return null;
  var yrs=(Date.now()-new Date(fd))/(365.25*24*3600*1000);
  if(yrs<0.05)return null;
  return Math.pow(1+(price-cost)/cost,1/yrs)-1;
}

// ─── CALC ───
function avgFx(){
  var tu=0,tt=0;
  S.E.forEach(function(e){tu+=e.usd;tt+=e.twd;});
  return tu>0?tt/tu:S.acc.rate;
}
function mktVal(h){return h.shares*(h.isOption?h.price*100:h.price);}
function costBasis(h){return h.shares*h.cost;}
function calc(){
  var act=S.H.filter(function(h){return h.shares>0;});
  var mkt=0,cost=0,todayChg=0;
  act.forEach(function(h){mkt+=mktVal(h);cost+=costBasis(h);todayChg+=h.shares*(h.chg||0)*(h.isOption?100:1);});
  var real=0,div=0;
  S.H.forEach(function(h){real+=(h.realized||0);div+=(h.div||0);});
  var totalCash=(S.acc.cashFT||0)+(S.acc.cashSchwab||0)+(S.acc.cashCathay||0);
  // totalInvested = sum of USD actually deposited via FX (S.E), i.e. real capital invested
  var totalInvested=0, twdInvested=0;
  S.E.forEach(function(e){totalInvested+=e.usd||0; twdInvested+=e.twd||0;});
  return{mkt:mkt,cost:cost,unreal:mkt-cost,real:real,div:div,todayChg:todayChg,
    totalUSD:mkt+totalCash,totalTWD:(mkt+totalCash)*S.acc.rate,fxRate:avgFx(),act:act,cash:totalCash,
    totalInvested:totalInvested,twdInvested:twdInvested};
}

// ─── GITHUB SYNC ───
var GH_FILE="stock-data.json";
function ghHdr(){return{"Authorization":"token "+S.ghToken,"Accept":"application/vnd.github.v3+json","Content-Type":"application/json"};}
function loadFromGitHub(force){
  if(!S.ghToken||!S.ghUser||!S.ghRepo)return Promise.resolve(false);
  if(!force&&S._localTs&&(Date.now()-S._localTs)<10000){console.log("Skipping GH load - recent local change");return Promise.resolve(false);}
  return fetch("https://api.github.com/repos/"+S.ghUser+"/"+S.ghRepo+"/contents/"+GH_FILE,{headers:ghHdr()})
  .then(function(r){
    if(r.status===404)return false;
    if(!r.ok)throw new Error("GitHub "+r.status);
    return r.json();
  }).then(function(d){
    if(!d||d===false)return false;
    S.ghSHA=d.sha;localStorage.setItem("ft_ghSHA",S.ghSHA);
    var b64=d.content.replace(/[\r\n]/g,"");
    var json=decodeURIComponent(escape(atob(b64)));
    var data=JSON.parse(json);
    if(data.H)S.H=data.H;if(data.T)S.T=data.T;if(data.E)S.E=data.E;if(data.acc)S.acc=data.acc;
    if(!S.acc.cashAdj)S.acc.cashAdj={FT:0,Schwab:0,GT:0};
    ["H","T","E","acc"].forEach(function(k){localStorage.setItem("ft_"+k,JSON.stringify(S[k]));});
    recalcCash();
    return true;
  }).catch(function(e){console.error("GH load",e);return false;});
}
function syncToGitHub(){
  if(!S.ghToken||!S.ghUser||!S.ghRepo)return;
  S.syncing=true;setSyncStatus("syncing");
  var data=JSON.stringify({v:1,H:S.H,T:S.T,E:S.E,acc:S.acc},null,2);
  var content=btoa(unescape(encodeURIComponent(data)));
  var body={message:"sync "+new Date().toISOString().slice(0,16),content:content};
  if(S.ghSHA)body.sha=S.ghSHA;
  fetch("https://api.github.com/repos/"+S.ghUser+"/"+S.ghRepo+"/contents/"+GH_FILE,
    {method:"PUT",headers:ghHdr(),body:JSON.stringify(body)})
  .then(function(r){if(!r.ok)throw new Error("sync failed "+r.status);return r.json();})
  .then(function(d){S.ghSHA=d.content.sha;localStorage.setItem("ft_ghSHA",S.ghSHA);setSyncStatus("ok");})
  .catch(function(e){console.error("GH sync",e);setSyncStatus("err");})
  .finally(function(){S.syncing=false;});
}
function setSyncStatus(s){
  var el=document.getElementById("ss");if(!el)return;
  if(s==="syncing")el.textContent="☁️ 同步中…";
  else if(s==="ok")el.textContent="☁️ 已同步 "+new Date().toLocaleTimeString();
  else if(s==="err")el.textContent="☁️ 同步失敗";
  else el.textContent="";
}
function saveGHConfig(){
  S.ghToken=document.getElementById("gh-token").value.trim();
  S.ghUser=document.getElementById("gh-user").value.trim();
  S.ghRepo=document.getElementById("gh-repo").value.trim();
  localStorage.setItem("ft_ghToken",S.ghToken);
  localStorage.setItem("ft_ghUser",S.ghUser);
  localStorage.setItem("ft_ghRepo",S.ghRepo);
  toast("✅ GitHub 設定已儲存，載入雲端資料中…");
  loadFromGitHub(true).then(function(ok){
    if(ok){toast("✅ 已從 GitHub 載入資料");render();}
    else toast("⚠️ 找不到雲端資料，下次儲存時會自動建立");
  });
}
function ghLoad(){
  loadFromGitHub(true).then(function(ok){
    if(ok){toast("✅ 已載入最新雲端資料");render();}
    else toast("❌ 載入失敗，請確認設定");
  });
}

// ─── PRICE UPDATE ───
async function updatePrices(){
  if(S.updating)return;
  var _rawSyms=S.H.filter(function(h){return h.shares>0&&!h.sym.includes("Call")&&!h.sym.includes("Put");}).map(function(h){return h.sym;});
  var syms=_rawSyms.filter(function(s,i){return _rawSyms.indexOf(s)===i;});
  if(!syms.length){toast("沒有有效持倉");return;}
  S.updating=true;render();
  try{
    var r=await fetch("/api/quote?sym="+encodeURIComponent(syms.join(",")));
    if(!r.ok)throw new Error("API "+r.status);
    var data=await r.json();
    var n=0;
    S.H=S.H.map(function(h){
      if(data[h.sym]&&!data[h.sym].error){
        n++;
        return Object.assign({},h,{price:parseFloat(data[h.sym].price.toFixed(2)),chg:parseFloat((data[h.sym].chg||0).toFixed(2))});
      }
      return h;
    });
    sv("H");
    toast(n>0?"✅ 已更新 "+n+" 支報價（"+new Date().toLocaleTimeString()+"）":"❌ 無法取得報價，請確認網路");
  }catch(e){toast("❌ 更新失敗："+e.message);}
  S.updating=false;render();
}

function applyTx(tx){
  var type=tx.type,sym=tx.sym,shares=tx.shares,price=tx.price,fee=tx.fee||0,amt=tx.amt||0,date=tx.date;
  if(!sym||!shares||shares<=0)return true;
  var i;
  if(type==="買入"){
    i=S.H.findIndex(function(h){return h.sym===sym;});
    var acct=tx.source||"FT";
    if(i>=0&&S.H[i].acct===acct){
      var ns=S.H[i].shares+shares,nc=(S.H[i].shares*S.H[i].cost+shares*price)/ns;
      S.H=S.H.map(function(h,j){return j===i?Object.assign({},h,{shares:ns,cost:parseFloat(nc.toFixed(6))}):h;});
    }else if(i>=0&&S.H[i].acct!==acct){
      // Different account - add as separate holding
      var existAcct=S.H.find(function(h){return h.sym===sym&&h.acct===acct;});
      if(existAcct){
        var ei=S.H.indexOf(existAcct),ns2=existAcct.shares+shares,nc2=(existAcct.shares*existAcct.cost+shares*price)/ns2;
        S.H=S.H.map(function(h,j){return j===ei?Object.assign({},h,{shares:ns2,cost:parseFloat(nc2.toFixed(6))}):h;});
      }else{
        S.H.push({id:gid(),sym:sym,shares:shares,cost:price,price:price,chg:0,div:0,realized:0,note:"",fd:date||today(),acct:acct});
      }
    }else{
      S.H.push({id:gid(),sym:sym,shares:shares,cost:price,price:price,chg:0,div:0,realized:0,note:"",fd:date||today(),acct:acct});
    }
  }else if(type==="賣出"){
    var acctS=tx.source||"FT";
    i=S.H.findIndex(function(h){return h.sym===sym&&(h.acct===acctS||!h.acct);});
    if(i<0)i=S.H.findIndex(function(h){return h.sym===sym;});
    if(i<0){return true;}  // no holding = ignore sell silently
    if(shares>S.H[i].shares+0.0001){return true;}  // over-sell = ignore silently
    var gain=(price-S.H[i].cost)*shares-fee;
    S.H=S.H.map(function(h,j){return j===i?Object.assign({},h,{shares:Math.max(0,h.shares-shares),realized:parseFloat(((h.realized||0)+gain).toFixed(2))}):h;});

  }else if(type==="配息"&&sym&&amt>0){
    var divAcct=tx.source||"FT";
    i=S.H.findIndex(function(h){return h.sym===sym&&(h.acct===divAcct||!h.acct);});
    if(i<0)i=S.H.findIndex(function(h){return h.sym===sym;});
    if(i>=0){
      S.H=S.H.map(function(h,j){return j===i?Object.assign({},h,{div:parseFloat(((h.div||0)+amt).toFixed(2))}):h;});
    }
  }
  return true;
}

function recalcCash(){
  // Step 1: start from FX deposit records (S.E) per account
  var cashFT=0, cashSchwab=0, cashGT=0;
  S.E.forEach(function(e){
    var acct=e.acct||"GT";
    var usd=e.usd||0;
    if(acct==="FT")cashFT+=usd;
    else if(acct==="Schwab")cashSchwab+=usd;
    else if(acct==="GT"||acct==="Cathay")cashGT+=usd;
  });
  // Step 2: apply manual adjustments
  var adj=S.acc.cashAdj||{FT:0,Schwab:0,GT:0};
  cashFT+=adj.FT||0;
  cashSchwab+=adj.Schwab||0;
  cashGT+=adj.GT||0;
  // Step 3: apply trade transactions (買入/賣出/配息 etc, skip 入金 which is already in S.E)
  S.T.forEach(function(t){
    var d=(t.desc||"").toUpperCase();
    var amt=t.amt||0;
    var src=t.source||"FT";
    if(t.type==="入金")return; // already counted via S.E
    if(d.includes("XFER CASH TO MARGIN")&&amt>0)return;
    if(src==="FT")cashFT+=amt;
    else if(src==="Schwab")cashSchwab+=amt;
    else if(src==="GT"||src==="Cathay")cashGT+=amt;
  });
  S.acc.cashFT=parseFloat(cashFT.toFixed(2));
  S.acc.cashSchwab=parseFloat(cashSchwab.toFixed(2));
  S.acc.cashCathay=parseFloat(cashGT.toFixed(2));
  S.acc.cash=S.acc.cashFT+S.acc.cashSchwab+S.acc.cashCathay;
  var eft=document.getElementById("ic-ft");
  var esw=document.getElementById("ic-sw");
  var ect=document.getElementById("ic-ct");
  if(eft)eft.value=S.acc.cashFT.toFixed(2);
  if(esw)esw.value=S.acc.cashSchwab.toFixed(2);
  if(ect)ect.value=S.acc.cashCathay.toFixed(2);
  return S.acc.cashFT;
}
function rebuildFromTx(){
  if(!confirm("根據所有交易紀錄重新計算持倉股數、均成本、損益。\n現價、備註保留。確定？"))return;
  var map={};
  var sorted=S.T.slice().sort(function(a,b){return a.date.localeCompare(b.date);});
  sorted.forEach(function(tx){
    var sym=tx.sym,shares=tx.shares,price=tx.price,fee=tx.fee||0,amt=tx.amt||0;
    if(!sym)return;
    var mapKey=sym+(tx.source||"FT");
    if(tx.type==="買入"&&shares>0&&price>0){
      if(!map[mapKey])map[mapKey]={sym:sym,shares:0,cost:0,realized:0,div:0,fd:tx.date,acct:tx.source||"FT"};
      var ns=map[mapKey].shares+shares;
      map[mapKey].cost=ns>0?(map[mapKey].shares*map[mapKey].cost+shares*price)/ns:0;
      map[mapKey].shares=ns;
      if(!map[mapKey].fd||tx.date<map[mapKey].fd)map[mapKey].fd=tx.date;
    }else if(tx.type==="賣出"&&shares>0&&price>0&&map[mapKey]){
      map[mapKey].realized+=(price-map[mapKey].cost)*shares-fee;
      map[mapKey].shares=Math.max(0,map[mapKey].shares-shares);
    }else if(tx.type==="配息"&&amt>0&&map[mapKey]){
      map[mapKey].div+=amt;
    }
  });
  S.H=Object.values(map).map(function(h){
    var ex=S.H.find(function(e){return e.sym===h.sym&&(!h.acct||e.acct===h.acct);});
    return{id:ex?ex.id:gid(),sym:h.sym,shares:h.shares,cost:parseFloat(h.cost.toFixed(6)),
      price:ex?ex.price:0,chg:ex?ex.chg:0,div:parseFloat(h.div.toFixed(2)),
      realized:parseFloat(h.realized.toFixed(2)),note:ex?ex.note:"",fd:h.fd,acct:h.acct||ex&&ex.acct||"FT"};
  });
  sv("H");
  recalcCash();
  S.tab="holdings";
  toast("✅ 從 "+sorted.length+" 筆交易重建完成，共 "+S.H.length+" 支，現金 $"+fn(S.acc.cash,2));
  render();
}

// ─── SCHWAB CSV PARSER ───────────────────────────────────────────────────────
function parseSchwabAmt(s){
  if(!s||!s.trim())return 0;
  return parseFloat(s.trim().replace(/[$,]/g,""))||0;
}
function parseSchwabDate(s){
  if(!s||!s.trim())return"";
  // Handle "MM/DD/YYYY as of MM/DD/YYYY" format
  var clean=s.trim().split(" as of ")[0].trim();
  var p=clean.split("/");
  if(p.length!==3)return clean;
  return p[2]+"-"+p[0].padStart(2,"0")+"-"+p[1].padStart(2,"0");
}
function classifySchwab(action){
  var a=action.trim();
  if(a==="Buy")return"買入";
  if(a==="Reinvest Shares")return"買入";  // dividend reinvestment = buy
  if(a==="Sell")return"賣出";
  if(a==="Qualified Dividend"||a==="Cash Dividend"||a==="Qual Div Reinvest")return"配息";
  if(a==="Credit Interest"||a==="Bond Interest")return"現金利息";
  if(a==="Wire Received"||a==="Wire Funds Received")return"入金";
  if(a==="NRA Tax Adj")return"預扣稅";
  // Journaled Shares / Security Transfer = TD→Schwab ACAT stock migration → treat as 買入 (uses cost basis from price field)
  if(a==="Journaled Shares"||a==="Security Transfer")return"買入";
  // Internal Transfer = cash movement between Schwab accounts → treat as 入金
  if(a==="Internal Transfer")return"入金";
  return"其他";
}

// ─── FSV IMPORT ───
function parseFSV(text){
  var lines=text.trim().split(/\r?\n/);
  var delim=lines[0].includes("\t")?"\t":",";
  var headers=lines[0].split(delim).map(function(h){return h.trim().replace(/^"|"$/g,"").toLowerCase();});
  function idx(h){return headers.indexOf(h);}
  var rows=[];
  for(var i=1;i<lines.length;i++){
    var cells=lines[i].split(delim).map(function(c){return c.trim().replace(/^"|"$/g,"");});
    if(cells.length<5)continue;
    rows.push({qty:parseFloat(cells[idx("quantity")])||0,price:parseFloat(cells[idx("price")])||0,
      action:(cells[idx("action")]||"").trim(),desc:(cells[idx("description")]||"").trim(),
      date:(cells[idx("tradedate")]||cells[idx("date")]||"").trim().slice(0,10),
      amount:parseFloat(cells[idx("amount")])||0,commission:parseFloat(cells[idx("commission")])||0,
      fee:parseFloat(cells[idx("fee")])||0,cusip:(cells[idx("cusip")]||"").trim(),
      recType:(cells[idx("recordtype")]||"").trim()});
  }
  return rows;
}
function classifyFSV(r){
  var d=r.desc.toUpperCase();
  var amt=r.amount||0;
  if(r.action==="BUY")return"買入";
  if(r.action==="SELL")return"賣出";
  if(r.action==="Interest")return"現金利息";
  if(r.action==="DIV"||d.includes("DIVIDEND"))return"配息";
  if(d.includes("TFR"))return"其他";
  // Negative XFER MARGIN TO CASH = tax withholding actually deducted from cash
  if(d.includes("XFER MARGIN TO CASH")&&amt<0)return"預扣稅";
  if(d.includes("XFER"))return"其他";
  if(d.includes("WIRE FUNDS"))return"入金";
  if(d.includes("TRANSFER FROM")&&d.includes("ACAT"))return"入金";
  if(d.includes("REBATE"))return"匯費補貼";
  return"其他";
}
function cleanName(desc){
  var callMatch=desc.match(/(?:CALL|PUT)\s+([A-Z]{1,5})\s/i);
  if(callMatch)return"OPTION:"+callMatch[1].toUpperCase();
  return desc
    .replace(/^\*+/,"")                                        
    .replace(/\s+EXEC\s+TIME[:\s]+[\d\-:\s]+/gi,"")       
    .replace(/\s+UNSOLICITED\b/gi,"")                         
    .replace(/\s+(SPONSORED\s+ADR\b|SPONSORED\s+REPSTG[\s\S]*?(?=\s*$)|ORDINARY\s+SHARES?)/gi,"")
    .replace(/\s+REPSTG[\s\S]*$/gi,"")                       
    .replace(/\s+SER\s+[A-Z]\b/gi,"")                        
    .replace(/\s+(COMMON\s+STOCK|INC\b|CORP\b|LTD\b|ETF\b|ADR\b|TECHNOLOGIES?\b|TECHNOLOGY\b|CLASS\s+[A-C]\b)/gi,"")
    .replace(/\s+/g," ").trim();
}
var KNOWN_SYM={
  "AMAZON":"AMZN","ASTERA LABS":"ALAB","ONDAS":"ONDS","SOFI":"SOFI",
  "KIORA":"KBSX","TESLA":"TSLA","RAMBUS":"RMBS","NVIDIA":"NVDA",
  "APPLE":"AAPL","MICROSOFT":"MSFT","META ":"META","ALPHABET":"GOOGL",
  "IREN":"IREN","MICRON":"MU","ECHOSTAR":"SATS","PALANTIR":"PLTR",
  "NOKIA":"NOK","MARVELL":"MRVL","BROADCOM":"AVGO","AMD":"AMD",
  "ADVANCED MICRO":"AMD","INTEL":"INTC","QUALCOMM":"QCOM"
};
function guessSymbol(name){
  var u=name.toUpperCase();
  for(var k in KNOWN_SYM){if(u.includes(k))return KNOWN_SYM[k];}
  return "";
}
function openFSVImport(){document.getElementById("fsv-file").click();}
function onFSVFile(input){
  var f=input.files[0];if(!f)return;

    try{
      var rows=parseFSV(e.target.result);
      var companies={};
      rows.forEach(function(row){
        if((row.action==="BUY"||row.action==="SELL"||row.action==="DIV")&&row.desc){
          var co=cleanName(row.desc);
          if(co.startsWith("OPTION:")){
            var underlying=co.replace("OPTION:","");
            if(!companies[co])companies[co]=underlying+" Call/Put";
          }else{
            if(!companies[co])companies[co]=guessSymbol(co);

      });
      S.imp={rows:rows,symMap:companies,step:1};
      S.tab="settings";render();
      var el=document.getElementById("fsv-panel");
      if(el)el.scrollIntoView({behavior:"smooth",block:"nearest"});

  };
  r.readAsText(f,"UTF-8");
  input.value="";
}

    if(!sym||!shares||shares<=0)return;
    if(tx.type==="買入"){
      if(!ftMap[sym])ftMap[sym]={shares:0,cost:0,div:0,realized:0,fd:tx.date};
      var ns=ftMap[sym].shares+shares;
      ftMap[sym].cost=ns>0?(ftMap[sym].shares*ftMap[sym].cost+shares*price)/ns:0;
      ftMap[sym].shares=ns;
    }else if(tx.type==="賣出"){
      if(!ftMap[sym])ftMap[sym]={shares:0,cost:0,div:0,realized:0,fd:tx.date};
      ftMap[sym].realized+=((price-ftMap[sym].cost)*shares-fee);
      ftMap[sym].shares=Math.max(0,ftMap[sym].shares-shares);
    }else if(tx.type==="配息"&&sym){
      if(!ftMap[sym])ftMap[sym]={shares:0,cost:0,div:0,realized:0,fd:tx.date};
      ftMap[sym].div+=amt;
    }
  });
  var ftHoldings=Object.keys(ftMap).map(function(sym){
    var h=ftMap[sym],ex=S.H.find(function(e){return e.sym===sym&&e.acct==="FT";});
    return{id:ex?ex.id:gid(),sym:sym,shares:h.shares,cost:parseFloat(h.cost.toFixed(6)),
      price:ex?ex.price:0,chg:ex?ex.chg:0,div:parseFloat(h.div.toFixed(2)),
      realized:parseFloat(h.realized.toFixed(2)),note:ex?ex.note:"",fd:h.fd,acct:"FT"};
  });
  // Handle ONDS Call (option) specially
  var callEntry=S.H.filter(function(h){return h.acct==="FT"&&h.isOption;});
  S.H=S.H.filter(function(h){return h.acct&&h.acct!=="FT"&&!h.isOption;}).concat(ftHoldings).concat(callEntry);
  sv("T");sv("H");
  var cash=recalcCash();
  S.imp={rows:[],symMap:{},step:0};
  toast("✅ 匯入完成：新增 "+added+" 筆，現金 $"+fn(cash,2));
  S.tab="dash";render();
  clearTimeout(S._syncTimer);
  syncToGitHub();
}

var NEWS_STATE={articles:[],loading:false,error:"",lastFetch:0};

// Sym → full company name for better news search
var SYM_NAMES={
  "AAPL":"Apple","MSFT":"Microsoft","NVDA":"NVIDIA","TSLA":"Tesla","AMZN":"Amazon",
  "GOOGL":"Alphabet Google","META":"Meta Facebook","PLTR":"Palantir","SOFI":"SoFi Technologies",
  "ONDS":"Ondas Holdings","KBSX":"Kiora Pharmaceuticals","MU":"Micron Technology",
  "MRVL":"Marvell Technology","NOK":"Nokia","RMBS":"Rambus","IREN":"IREN Limited",
  "SATS":"EchoStar","ALAB":"Astera Labs","AMD":"Advanced Micro Devices","INTC":"Intel",
  "QCOM":"Qualcomm","AVGO":"Broadcom","AAON":"AAON","CRWD":"CrowdStrike",
  "CRNC":"Cerence","NET":"Cloudflare","SNOW":"Snowflake","UBER":"Uber"
};

async function fetchNews(){
  if(!S.newsApiKey){NEWS_STATE.error="請先在設定頁填入 NewsAPI Key";renderNewsPanel();return;}
  if(NEWS_STATE.loading)return;
  var now=Date.now();
  if(now-NEWS_STATE.lastFetch<300000&&NEWS_STATE.articles.length){renderNewsPanel();return;}
  NEWS_STATE.loading=true;NEWS_STATE.error="";
  renderNewsPanel();
  var syms=[...new Set(S.H.filter(function(h){return h.shares>0&&!h.sym.includes("Call")&&!h.sym.includes("Put");}).map(function(h){return h.sym;}))].slice(0,6);
  if(!syms.length){NEWS_STATE.loading=false;NEWS_STATE.error="尚無持倉";renderNewsPanel();return;}
  // Build query using company names + stock keyword to improve relevance
  var terms=syms.map(function(s){
    var name=SYM_NAMES[s];
    return name?'"'+name+'"':'"'+s+'" stock';
  });
  var q="("+terms.join(" OR ")+") AND (stock OR shares OR earnings OR market OR investor)";
  try{
    var url="/api/news?q="+encodeURIComponent(q)+"&apiKey="+encodeURIComponent(S.newsApiKey);
    var r=await fetch(url);
    var d=await r.json();
    if(d.status!=="ok")throw new Error(d.message||"API error");
    // Filter: must contain at least one sym or company name in title/description
    var filtered=(d.articles||[]).filter(function(a){
      var txt=((a.title||"")+" "+(a.description||"")).toUpperCase();
      return syms.some(function(s){
        var name=(SYM_NAMES[s]||"").toUpperCase().split(" ")[0];
        return txt.includes(s) || (name.length>3&&txt.includes(name));
      });
    });
    NEWS_STATE.articles=filtered;
    NEWS_STATE.lastFetch=Date.now();
    NEWS_STATE.error="";
  }catch(e){
    NEWS_STATE.error="新聞載入失敗："+e.message;
  }
  NEWS_STATE.loading=false;
  renderNewsPanel();
}

// Keywords that indicate non-financial content - filter these out
var NEWS_EXCLUDE_WORDS=["horror","entertainment","recipe","fashion","travel","sports","soccer","football","basketball","baseball","nfl","nba","mlb","world cup","stadium workers","apple watch","airpods","macbook","iphone deal","ipad deal","sale","discount","coupon","#entertainment","del toro","movie","film","tv show","series","album","song","concert","oscar","emmy","grammy","celebrity","tiananmen","anti-corruption","neo-familism"];

function matchSym(a){
  var title=((a.title||"")+" "+(a.description||"")).toUpperCase();
  var mySyms=[...new Set(S.H.filter(function(h){return h.shares>0&&!h.sym.includes("Call")&&!h.sym.includes("Put");}).map(function(h){return h.sym;}))];
  // Check each holding
  for(var i=0;i<mySyms.length;i++){
    var s=mySyms[i];
    var name=(SYM_NAMES[s]||"").toUpperCase().split(" ")[0];
    if(title.includes(" "+s+" ")||title.startsWith(s+" ")||title.includes(s+"'S")||title.includes(s+",")||title.includes(s+")")){return s;}
    if(name.length>4&&title.includes(name)){return s;}
  }
  return null;
}

function isFinancialNews(a){
  var txt=((a.title||"")+" "+(a.description||"")).toLowerCase();
  // Exclude non-financial topics
  for(var i=0;i<NEWS_EXCLUDE_WORDS.length;i++){if(txt.includes(NEWS_EXCLUDE_WORDS[i]))return false;}
  // Must contain at least one financial keyword OR a matched sym
  var finWords=["stock","shares","earnings","revenue","profit","investor","market","nasdaq","nyse","sec","ipo","valuation","analyst","upgrade","downgrade","buy","sell","hold","quarter","fiscal","guidance","outlook","fund","etf"];
  return finWords.some(function(w){return txt.includes(w);});
}

function renderNewsPanel(){
  var el=document.getElementById("news-panel");
  if(!el)return;
  var html="";
  if(NEWS_STATE.loading){
    html="<div style='padding:16px;text-align:center;color:var(--text2);font-size:12px'><span class='spin'></span> 載入新聞中…</div>";
  }else if(NEWS_STATE.error){
    html="<div style='padding:12px 16px;color:var(--red);font-size:12px'>⚠ "+esc(NEWS_STATE.error)+"</div>";
  }else if(!NEWS_STATE.articles.length){
    html="<div style='padding:12px 16px;color:var(--text2);font-size:12px'>尚無新聞，請填入 NewsAPI Key 或稍後再試。</div>";
  }else{
    var acctBadgeCls={"FT":"bft","Schwab":"bsw","GT":"bgt"};
    // Score each article: find matching sym + check if financial
    var processed=NEWS_STATE.articles.map(function(a){
      var sym=matchSym(a);
      var isFinancial=isFinancialNews(a);
      return{a:a,sym:sym,ok:sym&&isFinancial};
    });
    // Sort: matched+financial first, then matched only, then rest
    var sorted=processed.filter(function(x){return x.ok;})
      .concat(processed.filter(function(x){return x.sym&&!x.ok;}))
      .concat(processed.filter(function(x){return !x.sym&&isFinancialNews(x.a);}));
    var shown=sorted.slice(0,12);
    if(!shown.length){
      html="<div style='padding:14px;color:var(--text2);font-size:12px'>未找到相關財經新聞，請點「重新整理」再試。</div>";
    }else{
      shown.forEach(function(x){
        var a=x.a,sym=x.sym;
        var pub=a.publishedAt?new Date(a.publishedAt):null;
        var timeStr=pub?timeSince(pub):"";
        var srcName=a.source&&a.source.name?a.source.name:"";
        // Find which acct this sym belongs to
        var holding=sym&&S.H.find(function(h){return h.sym===sym&&h.shares>0;});
        var acctCls=holding?acctBadgeCls[holding.acct||"FT"]||"br":"bft";
        html+="<div style='padding:10px 14px;border-bottom:0.5px solid var(--border);display:flex;flex-direction:column;gap:4px'>";
        if(sym){
          html+="<div style='display:flex;gap:5px;align-items:center;flex-wrap:wrap'>";
          html+="<span class='badge "+acctCls+"' style='font-size:10px'>"+sym+"</span>";
          if(holding){html+="<span style='font-size:10px;color:var(--text3)'>"+fn(holding.price,2)+" · "+(holding.shares*(holding.price-holding.cost)>=0?"<span class='pos'>":"<span class='neg'>")+(holding.shares*(holding.price-holding.cost)>=0?"+":"")+fp((holding.price-holding.cost)/holding.cost)+"</span></span>";}
          html+="</div>";
        }
        html+="<a href='"+esc(a.url)+"' target='_blank' style='font-size:12px;font-weight:500;color:var(--text);text-decoration:none;line-height:1.45;display:block'>"+esc(a.title||"")+"</a>";
        if(a.description&&a.description.length>20){
          html+="<div style='font-size:11px;color:var(--text2);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden'>"+esc(a.description)+"</div>";
        }
        html+="<div style='display:flex;gap:8px;font-size:10px;color:var(--text3);margin-top:1px'>";
        if(srcName)html+="<span>"+esc(srcName)+"</span>";
        if(timeStr)html+="<span>"+timeStr+"</span>";
        html+="</div></div>";
      });
    }
    var updTime=NEWS_STATE.lastFetch?new Date(NEWS_STATE.lastFetch).toLocaleTimeString("zh-TW",{hour:"2-digit",minute:"2-digit"}):"";
    if(updTime)html+="<div style='padding:8px 14px;font-size:10px;color:var(--text3);border-top:0.5px solid var(--border)'>上次更新 "+updTime+"</div>";
  }
  el.innerHTML=html;
}

function timeSince(date){
  var s=Math.floor((Date.now()-date)/1000);
  if(s<60)return "剛剛";
  var m=Math.floor(s/60);if(m<60)return m+"分前";
  var h=Math.floor(m/60);if(h<24)return h+"小時前";
  return Math.floor(h/24)+"天前";
}

// ── Transaction form helpers ──
var TX_OUT=["買入"]; // types where money goes OUT (negative amt)
var TX_IN=["賣出","入金","配息","現金利息","匯費補貼","出金"]; // positive amt

function onTxTypeChange(type){
  var sign=document.getElementById("ft-amt-sign");
  var sharesRow=document.getElementById("ft-shares")&&document.getElementById("ft-shares").closest("div");
  var priceRow=document.getElementById("ft-price")&&document.getElementById("ft-price").closest("div");
  var symRow=document.getElementById("ft-sym")&&document.getElementById("ft-sym").closest("div");
  if(sign)sign.textContent=(TX_OUT.indexOf(type)>=0?"−（支出，自動計算）":"＋（收入，自動計算）");
  // show/hide sym, shares, price based on type
  var isTrade=["買入","賣出"].indexOf(type)>=0;
  var isDiv=type==="配息";
  if(symRow)symRow.style.display=(isTrade||isDiv)?"":"none";
  if(sharesRow)sharesRow.style.display=isTrade?"":"none";
  if(priceRow)priceRow.style.display=isTrade?"":"none";
  autoCalcAmt();
}

function autoCalcAmt(){
  var type=document.getElementById("ft-type")&&document.getElementById("ft-type").value||"";
  var shares=parseFloat(document.getElementById("ft-shares")&&document.getElementById("ft-shares").value)||0;
  var price=parseFloat(document.getElementById("ft-price")&&document.getElementById("ft-price").value)||0;
  var fee=parseFloat(document.getElementById("ft-fee")&&document.getElementById("ft-fee").value)||0;
  var absInput=document.getElementById("ft-amt-abs");
  var hiddenAmt=document.getElementById("ft-amt");
  if(!hiddenAmt)return;
  var isNeg=TX_OUT.indexOf(type)>=0;
  var absVal;
  // If shares+price are filled, always auto-calc (fee changes should update amt)
  // Only use manual absInput if shares or price are missing
  if(shares>0&&price>0){
    absVal=parseFloat((shares*price+(isNeg?fee:-fee)).toFixed(2));
    if(absInput)absInput.value=absVal; // keep display in sync
  }else if(absInput&&absInput.value!==""){
    // no shares/price - trust whatever was typed manually
    absVal=parseFloat(absInput.value)||0;
  }else{
    absVal=0;
  }
  hiddenAmt.value=isNeg?-absVal:absVal;
  var sign=document.getElementById("ft-amt-sign");
  if(sign)sign.textContent=absVal>0?(isNeg?"− $"+absVal.toFixed(2)+" (支出)":"＋ $"+absVal.toFixed(2)+" (收入)"):(isNeg?"−（支出，自動計算）":"＋（收入，自動計算）");
}

function addTx(){
  var type=document.getElementById("ft-type").value;

}
function renderKeepScroll(){
  var sy=window.pageYOffset||document.documentElement.scrollTop||0;
  // Lock scroll position during re-render
  document.documentElement.style.scrollBehavior="auto";
  render();
  // Restore immediately and also after paint
  window.scrollTo(0,sy);
  document.documentElement.scrollTop=sy;
  document.body.scrollTop=sy;
  requestAnimationFrame(function(){
    window.scrollTo(0,sy);
    document.documentElement.scrollTop=sy;
    setTimeout(function(){window.scrollTo(0,sy);},0);
    setTimeout(function(){window.scrollTo(0,sy);},100);
  });
}
