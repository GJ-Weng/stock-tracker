<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>退休目標追蹤</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#fff;--bg2:#f8f9fa;--bg3:#f1f3f5;--bg4:#e9ecef;--text:#1a1a2e;--text2:#6c757d;--border:#dee2e6;--border2:#ced4da;--green:#198754;--green-bg:#d1e7dd;--red:#dc3545;--red-bg:#f8d7da;--blue:#0d6efd;--blue-bg:#cfe2ff;--yellow:#856404;--yellow-bg:#fff3cd;--radius:8px;--radius-lg:12px}
@media(prefers-color-scheme:dark){:root{--bg:#111827;--bg2:#1f2937;--bg3:#374151;--bg4:#4b5563;--text:#f3f4f6;--text2:#9ca3af;--border:#374151;--border2:#4b5563;--green:#34d399;--green-bg:#064e3b;--red:#f87171;--red-bg:#7f1d1d;--blue:#60a5fa;--blue-bg:#1e3a5f;--yellow:#fbbf24;--yellow-bg:#451a03}}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5}
input,select{font-family:inherit;font-size:13px;padding:7px 10px;border:1px solid var(--border2);border-radius:var(--radius);background:var(--bg);color:var(--text);outline:none;width:100%}
input:focus,select:focus{border-color:var(--blue)}
button{font-family:inherit;cursor:pointer;transition:all .15s}
.btn{background:var(--bg);border:1px solid var(--border2);color:var(--text);padding:7px 14px;border-radius:var(--radius);font-size:13px}
.btn:hover{background:var(--bg2)}
.btn-blue{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:500}
.btn-blue:hover{filter:brightness(1.1)}
.btn-red{background:none;border:1px solid var(--red);color:var(--red);padding:4px 10px;border-radius:var(--radius);font-size:12px}
.btn-red:hover{background:var(--red-bg)}
.btn-sm{background:none;border:1px solid var(--border);color:var(--text2);padding:3px 8px;border-radius:var(--radius);font-size:11px}
.btn-sm:hover{border-color:var(--border2);color:var(--text)}
#hd{display:flex;justify-content:space-between;align-items:center;padding:11px 20px;border-bottom:1px solid var(--border);background:var(--bg);position:sticky;top:0;z-index:100;flex-wrap:wrap;gap:8px}
#hd h1{font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--green);flex-shrink:0}
.hr{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ai{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--text2)}
.ai input{width:78px;padding:4px 7px;font-size:12px}
nav{display:flex;border-bottom:1px solid var(--border);padding:0 16px;overflow-x:auto;background:var(--bg);position:sticky;top:49px;z-index:99}
.tab{padding:9px 14px;background:none;border:none;border-bottom:2.5px solid transparent;font-size:13px;color:var(--text2);cursor:pointer;white-space:nowrap}
.tab.active{color:var(--blue);border-bottom-color:var(--blue);font-weight:500}
main{padding:18px 20px;max-width:1440px;margin:0 auto}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:10px;margin-bottom:18px}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:13px 15px}
.cl{font-size:10px;color:var(--text2);text-transform:uppercase;letter-spacing:.6px;margin-bottom:5px;font-weight:500}
.cv{font-size:19px;font-weight:600;font-family:ui-monospace,monospace;line-height:1.2}
.cs{font-size:11px;color:var(--text2);margin-top:3px}
.cv.pos{color:var(--green)}.cv.neg{color:var(--red)}
.panel{border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;margin-bottom:16px}
.ph{padding:10px 14px;background:var(--bg2);font-size:11px;font-weight:500;color:var(--text2);text-transform:uppercase;letter-spacing:.4px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.sx{overflow-x:auto}.sy{max-height:460px;overflow-y:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:9px 11px;font-size:11px;font-weight:500;color:var(--text2);border-bottom:1px solid var(--border);background:var(--bg2);white-space:nowrap;cursor:pointer;user-select:none;position:sticky;top:0;z-index:1}
th:hover{color:var(--text);background:var(--bg3)}
th.sa::after{content:' ↑';color:var(--blue)}th.sd::after{content:' ↓';color:var(--blue)}
td{padding:8px 11px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--bg3)}
.num{font-family:ui-monospace,monospace;text-align:right;white-space:nowrap}
.pos{color:var(--green)}.neg{color:var(--red)}.neu{color:var(--text2)}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:500;white-space:nowrap}
.bb{background:var(--blue-bg);color:var(--blue)}.bs{background:var(--red-bg);color:var(--red)}.bd{background:var(--green-bg);color:var(--green)}.bi{background:var(--yellow-bg);color:var(--yellow)}.br{background:var(--bg3);color:var(--text2)}
.fb{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:14px;margin-bottom:14px}
.fg{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.fl{font-size:11px;color:var(--text2);margin-bottom:3px;text-transform:uppercase;letter-spacing:.3px;font-weight:500}
.fh{font-size:11px;color:var(--text2);margin-top:8px;padding:8px 10px;background:var(--bg3);border-radius:var(--radius)}
.filter-bar{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.chip{padding:4px 11px;border-radius:999px;font-size:12px;border:1px solid var(--border2);background:none;color:var(--text2);cursor:pointer}
.chip.active{background:var(--blue-bg);color:var(--blue);border-color:var(--blue)}
.ubtn{display:inline-flex;align-items:center;gap:6px;padding:6px 13px;border-radius:var(--radius);font-size:12px;background:var(--bg);border:1px solid var(--border2);color:var(--text);cursor:pointer;font-family:inherit;white-space:nowrap}
.ubtn:hover{background:var(--bg2)}
.ubtn.loading{opacity:.65;cursor:wait;pointer-events:none}
.spin{width:12px;height:12px;border:2px solid var(--border2);border-top-color:var(--blue);border-radius:50%;animation:sp .7s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.bw{height:5px;background:var(--bg4);border-radius:3px;margin-top:3px;overflow:hidden}
.bv{height:100%;border-radius:3px;background:var(--blue)}
.toast{position:fixed;bottom:22px;right:22px;background:var(--text);color:var(--bg);padding:10px 18px;border-radius:var(--radius-lg);font-size:13px;z-index:9999;opacity:0;transform:translateY(8px);transition:all .25s;pointer-events:none;max-width:360px}
.toast.show{opacity:1;transform:translateY(0)}
.si{padding:6px 10px;font-size:13px;border:1px solid var(--border2);border-radius:var(--radius);background:var(--bg);color:var(--text);outline:none;width:160px}
.cw{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:18px}
@media(max-width:700px){.cw{grid-template-columns:1fr}}
.cc{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:14px}
.ct{font-size:12px;font-weight:500;color:var(--text2);text-transform:uppercase;letter-spacing:.4px;margin-bottom:12px}
.li{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text2);padding:3px 0}
.ld{width:9px;height:9px;border-radius:2px;flex-shrink:0}
.sb{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px;margin-bottom:14px}
.sb h3{font-size:13px;font-weight:500;margin-bottom:10px}
.ib{background:var(--blue-bg);border-radius:var(--radius);padding:10px 12px;font-size:12px;color:var(--blue);margin-top:8px;line-height:1.7}
.wb{background:var(--yellow-bg);border-radius:var(--radius);padding:10px 12px;font-size:12px;color:var(--yellow);margin-top:8px;line-height:1.7}
.kr{display:flex;gap:8px}.kr input{flex:1}
#cash-panel.open{display:block!important}
@media(max-width:600px){main{padding:12px}#hd{padding:10px 14px}.ai{display:none}.cards{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div id="hd">
  <h1><span class="dot"></span> 退休目標追蹤 💰</h1>
  <div class="hr">
    <span id="ss" style="font-size:11px;color:var(--text2)"></span>
    <div class="ai"><span>USD/TWD</span><input type="number" id="ir" step="0.001" onchange="onAcc('rate',this.value)"></div>
    <div style="position:relative">
      <button class="btn" onclick="document.getElementById('cash-panel').classList.toggle('open')" style="font-size:12px;padding:4px 10px" title="由交易紀錄自動計算">💰 現金餘額 ▾</button>
      <div id="cash-panel" style="display:none;position:absolute;right:0;top:34px;background:var(--bg);border:1px solid var(--border2);border-radius:var(--radius-lg);padding:12px 14px;z-index:200;min-width:220px;box-shadow:0 4px 16px rgba(0,0,0,.12)">
        <div style="font-size:11px;color:var(--text2);font-weight:500;margin-bottom:8px;text-transform:uppercase;letter-spacing:.4px">帳戶現金（由交易自動計算）</div>
        <div style="font-size:10px;color:var(--text2);margin-bottom:6px;display:grid;grid-template-columns:70px 90px 80px;gap:4px;text-align:center"><span></span><span>自動計算</span><span>手動調整</span></div>
        <div style="display:grid;grid-template-columns:70px 90px 80px;gap:4px;align-items:center;margin-bottom:5px"><span style="font-size:12px">Firstrade</span><input type="number" id="ic-ft" readonly style="opacity:0.6;cursor:default;font-size:12px"><input type="number" id="ic-ft-adj" step="0.01" placeholder="±0" style="font-size:12px" onchange="onCashAdj('FT',this.value)" value="0"></div>
        <div style="display:grid;grid-template-columns:70px 90px 80px;gap:4px;align-items:center;margin-bottom:5px"><span style="font-size:12px">嘉信</span><input type="number" id="ic-sw" readonly style="opacity:0.6;cursor:default;font-size:12px"><input type="number" id="ic-sw-adj" step="0.01" placeholder="±0" style="font-size:12px" onchange="onCashAdj('Schwab',this.value)" value="0"></div>
        <div style="display:grid;grid-template-columns:70px 90px 80px;gap:4px;align-items:center"><span style="font-size:12px">國泰複委托</span><input type="number" id="ic-ct" readonly style="opacity:0.6;cursor:default;font-size:12px"><input type="number" id="ic-ct-adj" step="0.01" placeholder="±0" style="font-size:12px" onchange="onCashAdj('GT',this.value)" value="0"></div>
      </div>
    </div>
    <button class="btn" onclick="doExport()">⬇ 匯出</button>
  </div>
</div>
<nav>
  <button class="tab" data-tab="dash">📊 總覽</button>
  <button class="tab" data-tab="holdings">📈 持倉</button>
  <button class="tab" data-tab="tx">📝 交易</button>
  <button class="tab" data-tab="fx">💸 出入金</button>
  <button class="tab" data-tab="settings">⚙️ 設定</button>
</nav>
<main id="main"></main>
<div class="toast" id="toast"></div>
<input type="file" id="fsv-file" accept=".fsv,.csv,.txt" style="display:none" onchange="onFSVFile(this)">
<input type="file" id="schwab-file" accept=".csv,.txt" style="display:none" onchange="onSchwabFile(this)">
<input type="file" id="imp" accept=".json" style="display:none" onchange="importJSON(this)">

function toast(msg,ms){
  ms=ms||2800;
  var el=document.getElementById("toast");

function annualReturn(cost,price,fd){
  if(!fd||!cost||cost===0)return null;
  var yrs=(Date.now()-new Date(fd))/(365.25*24*3600*1000);
  if(yrs<0.05)return null;
  return Math.pow(1+(price-cost)/cost,1/yrs)-1;
}

function avgFx(){
  var tu=0,tt=0;
  S.E.forEach(function(e){tu+=e.usd;tt+=e.twd;});
  return tu>0?tt/tu:S.acc.rate;
}
function mktVal(h){return h.shares*(h.isOption?h.price*100:h.price);}
function costBasis(h){return h.shares*h.cost;}
function calc(){
  var act=S.H.filter(function(h){return h.shares>0;});
  var mkt=0,cost=0,todayChg=0;
  act.forEach(function(h){mkt+=mktVal(h);cost+=costBasis(h);todayChg+=h.shares*(h.chg||0)*(h.isOption?100:1);});
  var real=0,div=0;
  S.H.forEach(function(h){real+=(h.realized||0);div+=(h.div||0);});
  var totalCash=(S.acc.cashFT||0)+(S.acc.cashSchwab||0)+(S.acc.cashCathay||0);
  // totalInvested = sum of USD actually deposited via FX (S.E), i.e. real capital invested
  var totalInvested=0, twdInvested=0;
  S.E.forEach(function(e){totalInvested+=e.usd||0; twdInvested+=e.twd||0;});
  return{mkt:mkt,cost:cost,unreal:mkt-cost,real:real,div:div,todayChg:todayChg,
    totalUSD:mkt+totalCash,totalTWD:(mkt+totalCash)*S.acc.rate,fxRate:avgFx(),act:act,cash:totalCash,
    totalInvested:totalInvested,twdInvested:twdInvested};
}

var GH_FILE="stock-data.json";
function ghHdr(){return{"Authorization":"token "+S.ghToken,"Accept":"application/vnd.github.v3+json","Content-Type":"application/json"};}
function loadFromGitHub(force){
  if(!S.ghToken||!S.ghUser||!S.ghRepo)return Promise.resolve(false);
  if(!force&&S._localTs&&(Date.now()-S._localTs)<10000){console.log("Skipping GH load - recent local change");return Promise.resolve(false);}
  return fetch("https://api.github.com/repos/"+S.ghUser+"/"+S.ghRepo+"/contents/"+GH_FILE,{headers:ghHdr()})
  .then(function(r){
    if(r.status===404)return false;
    if(!r.ok)throw new Error("GitHub "+r.status);
    return r.json();
  }).then(function(d){
    if(!d||d===false)return false;
    S.ghSHA=d.sha;localStorage.setItem("ft_ghSHA",S.ghSHA);
    var b64=d.content.replace(/[\r\n]/g,"");
    var json=decodeURIComponent(escape(atob(b64)));
    var data=JSON.parse(json);
    if(data.H)S.H=data.H;if(data.T)S.T=data.T;if(data.E)S.E=data.E;if(data.acc)S.acc=data.acc;
    ["H","T","E","acc"].forEach(function(k){localStorage.setItem("ft_"+k,JSON.stringify(S[k]));});
    return true;
  }).catch(function(e){console.error("GH load",e);return false;});
}
function syncToGitHub(){
  if(!S.ghToken||!S.ghUser||!S.ghRepo)return;
  S.syncing=true;setSyncStatus("syncing");
  var data=JSON.stringify({H:S.H,T:S.T,E:S.E,acc:S.acc},null,2);
  var content=btoa(unescape(encodeURIComponent(data)));
  var body={message:"sync "+new Date().toISOString().slice(0,16),content:content};
  if(S.ghSHA)body.sha=S.ghSHA;
  fetch("https://api.github.com/repos/"+S.ghUser+"/"+S.ghRepo+"/contents/"+GH_FILE,
    {method:"PUT",headers:ghHdr(),body:JSON.stringify(body)})
  .then(function(r){if(!r.ok)throw new Error("sync failed "+r.status);return r.json();})
  .then(function(d){S.ghSHA=d.content.sha;localStorage.setItem("ft_ghSHA",S.ghSHA);setSyncStatus("ok");})
  .catch(function(e){console.error("GH sync",e);setSyncStatus("err");})
  .finally(function(){S.syncing=false;});
}
function setSyncStatus(s){
  var el=document.getElementById("ss");if(!el)return;
  if(s==="syncing")el.textContent="☁️ 同步中…";
  else if(s==="ok")el.textContent="☁️ 已同步 "+new Date().toLocaleTimeString();
  else if(s==="err")el.textContent="☁️ 同步失敗";
  else el.textContent="";
}

async function updatePrices(){
  if(S.updating)return;
  var _rawSyms=S.H.filter(function(h){return h.shares>0&&!h.sym.includes("Call")&&!h.sym.includes("Put");}).map(function(h){return h.sym;});
  var syms=_rawSyms.filter(function(s,i){return _rawSyms.indexOf(s)===i;});
  if(!syms.length){toast("沒有有效持倉");return;}
  S.updating=true;render();
  try{
    var r=await fetch("/api/quote?sym="+encodeURIComponent(syms.join(",")));
    if(!r.ok)throw new Error("API "+r.status);
    var data=await r.json();
    var n=0;
    S.H=S.H.map(function(h){
      if(data[h.sym]&&!data[h.sym].error){
        n++;
        return Object.assign({},h,{price:parseFloat(data[h.sym].price.toFixed(2)),chg:parseFloat((data[h.sym].chg||0).toFixed(2))});
      }
      return h;
    });
    sv("H");
    toast(n>0?"✅ 已更新 "+n+" 支報價（"+new Date().toLocaleTimeString()+"）":"❌ 無法取得報價，請確認網路");
  }catch(e){toast("❌ 更新失敗："+e.message);}
  S.updating=false;render();
}

// ─── HOLDINGS LOGIC ───
function applyTx(tx){
  var type=tx.type,sym=tx.sym,shares=tx.shares,price=tx.price,fee=tx.fee||0,amt=tx.amt||0,date=tx.date;
  if(!sym||!shares||shares<=0)return true;
  var i;
  if(type==="買入"){
    i=S.H.findIndex(function(h){return h.sym===sym;});
    var acct=tx.source||"FT";
    if(i>=0&&S.H[i].acct===acct){
      var ns=S.H[i].shares+shares,nc=(S.H[i].shares*S.H[i].cost+shares*price)/ns;
      S.H=S.H.map(function(h,j){return j===i?Object.assign({},h,{shares:ns,cost:parseFloat(nc.toFixed(6))}):h;});
    }else if(i>=0&&S.H[i].acct!==acct){
      // Different account - add as separate holding
      var existAcct=S.H.find(function(h){return h.sym===sym&&h.acct===acct;});
      if(existAcct){
        var ei=S.H.indexOf(existAcct),ns2=existAcct.shares+shares,nc2=(existAcct.shares*existAcct.cost+shares*price)/ns2;
        S.H=S.H.map(function(h,j){return j===ei?Object.assign({},h,{shares:ns2,cost:parseFloat(nc2.toFixed(6))}):h;});
      }else{
        S.H.push({id:gid(),sym:sym,shares:shares,cost:price,price:price,chg:0,div:0,realized:0,note:"",fd:date||today(),acct:acct});
      }
    }else{
      S.H.push({id:gid(),sym:sym,shares:shares,cost:price,price:price,chg:0,div:0,realized:0,note:"",fd:date||today(),acct:acct});
    }
  }else if(type==="賣出"){
    var acctS=tx.source||"FT";
    i=S.H.findIndex(function(h){return h.sym===sym&&(h.acct===acctS||!h.acct);});
    if(i<0)i=S.H.findIndex(function(h){return h.sym===sym;});
    if(i<0){return true;}  // no holding = ignore sell silently
    if(shares>S.H[i].shares+0.0001){return true;}  // over-sell = ignore silently
    var gain=(price-S.H[i].cost)*shares-fee;
    S.H=S.H.map(function(h,j){return j===i?Object.assign({},h,{shares:Math.max(0,h.shares-shares),realized:parseFloat(((h.realized||0)+gain).toFixed(2))}):h;});

  }else if(type==="配息"&&sym&&amt>0){
    i=S.H.findIndex(function(h){return h.sym===sym;});
    if(i>=0){
      S.H=S.H.map(function(h,j){return j===i?Object.assign({},h,{div:parseFloat(((h.div||0)+amt).toFixed(2))}):h;});
    }
  }
  return true;
}

function recalcCash(){
  // Step 1: start from FX deposit records (S.E) per account
  var cashFT=0, cashSchwab=0, cashGT=0;
  S.E.forEach(function(e){
    var acct=e.acct||"GT";
    var usd=e.usd||0;
    if(acct==="FT")cashFT+=usd;
    else if(acct==="Schwab")cashSchwab+=usd;
    else if(acct==="GT"||acct==="Cathay")cashGT+=usd;
  });
  // Step 2: apply manual adjustments
  var adj=S.acc.cashAdj||{FT:0,Schwab:0,GT:0};
  cashFT+=adj.FT||0;
  cashSchwab+=adj.Schwab||0;
  cashGT+=adj.GT||0;
  // Step 3: apply trade transactions (買入/賣出/配息 etc, skip 入金 which is already in S.E)
  S.T.forEach(function(t){
    var d=(t.desc||"").toUpperCase();
    var amt=t.amt||0;
    var src=t.source||"FT";
    if(t.type==="入金")return; // already counted via S.E
    if(d.includes("XFER CASH TO MARGIN")&&amt>0)return;
    if(src==="FT")cashFT+=amt;
    else if(src==="Schwab")cashSchwab+=amt;
    else if(src==="GT"||src==="Cathay")cashGT+=amt;
  });
  S.acc.cashFT=parseFloat(cashFT.toFixed(2));
  S.acc.cashSchwab=parseFloat(cashSchwab.toFixed(2));
  S.acc.cashCathay=parseFloat(cashGT.toFixed(2));
  S.acc.cash=S.acc.cashFT+S.acc.cashSchwab+S.acc.cashCathay;
  var eft=document.getElementById("ic-ft");
  var esw=document.getElementById("ic-sw");
  var ect=document.getElementById("ic-ct");
  if(eft)eft.value=S.acc.cashFT.toFixed(2);
  if(esw)esw.value=S.acc.cashSchwab.toFixed(2);
  if(ect)ect.value=S.acc.cashCathay.toFixed(2);
  return S.acc.cashFT;
}
function rebuildFromTx(){
  if(!confirm("根據所有交易紀錄重新計算持倉股數、均成本、損益。\n現價、備註保留。確定？"))return;
  var map={};
  var sorted=S.T.slice().sort(function(a,b){return a.date.localeCompare(b.date);});
  sorted.forEach(function(tx){
    var sym=tx.sym,shares=tx.shares,price=tx.price,fee=tx.fee||0,amt=tx.amt||0;
    if(!sym)return;
    var mapKey=sym+(tx.source||"FT");
    if(tx.type==="買入"&&shares>0&&price>0){
      if(!map[mapKey])map[mapKey]={sym:sym,shares:0,cost:0,realized:0,div:0,fd:tx.date,acct:tx.source||"FT"};
      var ns=map[mapKey].shares+shares;
      map[mapKey].cost=ns>0?(map[mapKey].shares*map[mapKey].cost+shares*price)/ns:0;
      map[mapKey].shares=ns;
      if(!map[mapKey].fd||tx.date<map[mapKey].fd)map[mapKey].fd=tx.date;
    }else if(tx.type==="賣出"&&shares>0&&price>0&&map[mapKey]){
      map[mapKey].realized+=(price-map[mapKey].cost)*shares-fee;
      map[mapKey].shares=Math.max(0,map[mapKey].shares-shares);
    }else if(tx.type==="配息"&&amt>0&&map[mapKey]){
      map[mapKey].div+=amt;
    }
  });
  S.H=Object.values(map).map(function(h){

// ─── SCHWAB CSV PARSER ───────────────────────────────────────────────────────
function parseSchwabAmt(s){
  if(!s||!s.trim())return 0;
  return parseFloat(s.trim().replace(/[$,]/g,""))||0;
}
function parseSchwabDate(s){
  if(!s||!s.trim())return"";
  // Handle "MM/DD/YYYY as of MM/DD/YYYY" format
  var clean=s.trim().split(" as of ")[0].trim();
  var p=clean.split("/");
  if(p.length!==3)return clean;
  return p[2]+"-"+p[0].padStart(2,"0")+"-"+p[1].padStart(2,"0");
}
function classifySchwab(action){
  var a=action.trim();
  if(a==="Buy")return"買入";
  if(a==="Reinvest Shares")return"買入";  // dividend reinvestment = buy
  if(a==="Sell")return"賣出";
  if(a==="Qualified Dividend"||a==="Cash Dividend"||a==="Qual Div Reinvest")return"配息";
  if(a==="Credit Interest"||a==="Bond Interest")return"現金利息";
  if(a==="Wire Received"||a==="Wire Funds Received")return"入金";
  if(a==="NRA Tax Adj")return"預扣稅";
  // Journaled Shares & Internal Transfer = TD→Schwab migration, skip
  if(a==="Journaled Shares"||a==="Internal Transfer")return"其他";
  if(a==="Security Transfer")return"其他";  // ACAT transfer between brokers
  return"其他";
}
var schwabImp={rows:[],step:0};
function openSchwabImport(){document.getElementById("schwab-file").click();}
function onSchwabFile(input){
  var f=input.files[0];if(!f)return;
  var r=new FileReader();
  r.onload=function(e){
    try{
      var text=e.target.result;
      var lines=text.trim().split(/\r?\n/);
      var headers=lines[0].split(",").map(function(h){return h.trim().replace(/^"|"$/g,"").toLowerCase();});
      function hIdx(h){return headers.indexOf(h);}
      var rows=[];
      for(var i=1;i<lines.length;i++){
        var cells=lines[i].split(",").map(function(c){return c.trim().replace(/^"|"$/g,"");});
        if(cells.length<4)continue;
        var action=(cells[hIdx("action")]||"").trim();
        if(!action)continue;
        rows.push({
          date:parseSchwabDate(cells[hIdx("date")]||""),
          action:action,
          sym:(cells[hIdx("symbol")]||"").trim().toUpperCase(),
          desc:(cells[hIdx("description")]||"").trim(),
          qty:parseFloat(cells[hIdx("quantity")])||0,
          price:parseSchwabAmt(cells[hIdx("price")]||""),
          fee:parseSchwabAmt(cells[hIdx("fees & comm")]||cells[hIdx("fees and comm")]||""),
          amount:parseSchwabAmt(cells[hIdx("amount")]||"")
        });
      }
      schwabImp={rows:rows,step:1};
      S.tab="settings";render();
      var el=document.getElementById("schwab-panel");
      if(el)el.scrollIntoView({behavior:"smooth",block:"nearest"});
    }catch(err){toast("❌ 嘉信 CSV 解析失敗："+err.message);console.error(err);}
  };
  r.readAsText(f,"UTF-8");
  input.value="";
}

function schwabConfirmImport(){
  var allRows=schwabImp.rows;
  allRows.sort(function(a,b){return a.date.localeCompare(b.date);});

  S.T=S.T.filter(function(t){return t.source&&t.source!=="Schwab";});
  S.H=S.H.filter(function(h){return h.acct&&h.acct!=="Schwab";});

  // Step 1: Build S.T with all transactions
  allRows.forEach(function(r){
    var type=classifySchwab(r.action);

      price:r.price,fee:Math.abs(r.fee),amt:r.amount,wire:0,desc:r.desc,source:"Schwab"};
    S.T.push(t);
  });

  // Step 2: Build holdings directly (handles sells with no buy history from TD)
  var hMap={};
  allRows.forEach(function(r){
    var sym=r.sym;if(!sym)return;
    var type=classifySchwab(r.action);

      hMap[sym].shares=ns;
    }else if(type==="賣出"&&qty>0){
      if(!hMap[sym])hMap[sym]={shares:0,cost:0,fd:r.date};

      if(!hMap[sym])hMap[sym]={shares:0,cost:0,fd:r.date};

  });

  var schwabH=Object.keys(hMap).map(function(sym){

  });

  sv("T");sv("H");
  schwabImp={rows:[],step:2};  // step 2 = ask for cash
  render();
  // Auto update prices after import
  setTimeout(function(){updatePrices();},500);
}

// ─── FSV IMPORT ───
function parseFSV(text){
  var lines=text.trim().split(/\r?\n/);
  var delim=lines[0].includes("\t")?"\t":",";
  var headers=lines[0].split(delim).map(function(h){return h.trim().replace(/^"|"$/g,"").toLowerCase();});
  function idx(h){return headers.indexOf(h);}
  var rows=[];
  for(var i=1;i<lines.length;i++){
    var cells=lines[i].split(delim).map(function(c){return c.trim().replace(/^"|"$/g,"");});
    if(cells.length<5)continue;
    rows.push({qty:parseFloat(cells[idx("quantity")])||0,price:parseFloat(cells[idx("price")])||0,
      action:(cells[idx("action")]||"").trim(),desc:(cells[idx("description")]||"").trim(),
      date:(cells[idx("tradedate")]||cells[idx("date")]||"").trim().slice(0,10),
      amount:parseFloat(cells[idx("amount")])||0,commission:parseFloat(cells[idx("commission")])||0,
      fee:parseFloat(cells[idx("fee")])||0,cusip:(cells[idx("cusip")]||"").trim(),
      recType:(cells[idx("recordtype")]||"").trim()});
  }
  return rows;
}
function classifyFSV(r){
  var d=r.desc.toUpperCase();
  var amt=r.amount||0;
  if(r.action==="BUY")return"買入";
  if(r.action==="SELL")return"賣出";
  if(r.action==="Interest")return"現金利息";
  if(r.action==="DIV"||d.includes("DIVIDEND"))return"配息";
  if(d.includes("TFR"))return"其他";
  // Negative XFER MARGIN TO CASH = tax withholding actually deducted from cash
  if(d.includes("XFER MARGIN TO CASH")&&amt<0)return"預扣稅";
  if(d.includes("XFER"))return"其他";
  if(d.includes("WIRE FUNDS"))return"入金";
  if(d.includes("TRANSFER FROM")&&d.includes("ACAT"))return"入金";
  if(d.includes("REBATE"))return"匯費補貼";
  return"其他";
}
function cleanName(desc){
  var callMatch=desc.match(/(?:CALL|PUT)\s+([A-Z]{1,5})\s/i);
  if(callMatch)return"OPTION:"+callMatch[1].toUpperCase();
  return desc
    .replace(/^\*+/,"")
    .replace(/\s+EXEC\s+TIME[:\s]+[\d\-:\s]+/gi,"")
    .replace(/\s+UNSOLICITED\b/gi,"")
    .replace(/\s+(COMMON STOCK|INC\b|CORP\b|LTD\b|ETF\b|ADR\b|TECHNOLOGIES?\b|CLASS\s+[A-C]\b)/gi,"")
    .replace(/\s+(SPONSORED\s+ADR|SPONSORED\s+REPSTG[^]*?(?=\s+[A-Z]{2,}|$)|ORDINARY\s+SHARES?|REPSTG.*?SER\s+[A-Z])/gi,"")
    .replace(/\s+/g," ").trim();
}
var KNOWN_SYM={
  "AMAZON":"AMZN","ASTERA LABS":"ALAB","ONDAS":"ONDS","SOFI":"SOFI",
  "KIORA":"KBSX","TESLA":"TSLA","RAMBUS":"RMBS","NVIDIA":"NVDA",
  "APPLE":"AAPL","MICROSOFT":"MSFT","META ":"META","ALPHABET":"GOOGL",
  "IREN":"IREN","MICRON":"MU","ECHOSTAR":"SATS","PALANTIR":"PLTR",
  "NOKIA":"NOK","MARVELL":"MRVL","BROADCOM":"AVGO","AMD":"AMD",
  "ADVANCED MICRO":"AMD","INTEL":"INTC","QUALCOMM":"QCOM"
};
function guessSymbol(name){
  var u=name.toUpperCase();
  for(var k in KNOWN_SYM){if(u.includes(k))return KNOWN_SYM[k];}
  return "";
}
function openFSVImport(){document.getElementById("fsv-file").click();}
function onFSVFile(input){
  var f=input.files[0];if(!f)return;
  var r=new FileReader();
  r.onload=function(e){
    try{
      var rows=parseFSV(e.target.result);
      var companies={};
      rows.forEach(function(row){
        if((row.action==="BUY"||row.action==="SELL"||row.action==="DIV")&&row.desc){
          var co=cleanName(row.desc);
          if(co.startsWith("OPTION:")){
            var underlying=co.replace("OPTION:","");
            if(!companies[co])companies[co]=underlying+" Call/Put";
          }else{
            if(!companies[co])companies[co]=guessSymbol(co);
          }
        }
      });
      S.imp={rows:rows,symMap:companies,step:1};
      S.tab="settings";render();
      var el=document.getElementById("fsv-panel");
      if(el)el.scrollIntoView({behavior:"smooth",block:"nearest"});
    }catch(err){toast("❌ 解析失敗："+err.message);}
  };
  r.readAsText(f,"UTF-8");
  input.value="";
}
function fsvConfirmMap(){
  Object.keys(S.imp.symMap).forEach(function(co){
    var el=document.getElementById("sym-"+btoa(co).replace(/[^a-zA-Z0-9]/g,"").slice(0,20));

function fsvBuildRows(){
  return S.imp.rows.map(function(r){
    var type=classifyFSV(r);
    var sym="",shares=0,price=0;
    if(r.action==="BUY"||r.action==="SELL"||r.action==="DIV"){
      var co=cleanName(r.desc);
      sym=S.imp.symMap[co]||"";
      shares=Math.abs(r.qty);price=r.price;
    }
    // Never skip - include all transactions so XFER/TFR pairs cancel correctly in cash calc
    return{date:r.date,type:type,sym:sym,shares:shares,price:price,
      fee:Math.abs(r.commission)+Math.abs(r.fee),amt:r.amount,wire:0,skip:false,desc:r.desc};
  });
}
function fsvConfirmImport(){
  var rows=fsvBuildRows();
  rows.sort(function(a,b){return a.date.localeCompare(b.date);});
  // Keep other accounts' data, only replace FT entries
  S.T=S.T.filter(function(t){return t.source&&t.source!=="FT";});
  S.H=S.H.filter(function(h){return h.acct&&h.acct!=="FT";});
  var added=0;
  rows.forEach(function(r){
    var t=Object.assign({id:gid(),source:"FT"},r);
    S.T.push(t);added++;
  });
  // Rebuild FT holdings from transactions (reliable, handles sells correctly)
  var ftMap={};
  S.T.filter(function(t){return t.source==="FT";}).sort(function(a,b){return a.date.localeCompare(b.date);}).forEach(function(tx){
    var sym=tx.sym,shares=tx.shares,price=tx.price,fee=tx.fee||0,amt=tx.amt||0;
    if(!sym||!shares||shares<=0)return;
    if(tx.type==="買入"){
      if(!ftMap[sym])ftMap[sym]={shares:0,cost:0,div:0,realized:0,fd:tx.date};
      var ns=ftMap[sym].shares+shares;
      ftMap[sym].cost=ns>0?(ftMap[sym].shares*ftMap[sym].cost+shares*price)/ns:0;
      ftMap[sym].shares=ns;
    }else if(tx.type==="賣出"){
      if(!ftMap[sym])ftMap[sym]={shares:0,cost:0,div:0,realized:0,fd:tx.date};
      ftMap[sym].realized+=((price-ftMap[sym].cost)*shares-fee);
      ftMap[sym].shares=Math.max(0,ftMap[sym].shares-shares);
    }else if(tx.type==="配息"&&sym){
      if(!ftMap[sym])ftMap[sym]={shares:0,cost:0,div:0,realized:0,fd:tx.date};
      ftMap[sym].div+=amt;
    }
  });
  var ftHoldings=Object.keys(ftMap).map(function(sym){
    var h=ftMap[sym],ex=S.H.find(function(e){return e.sym===sym&&e.acct==="FT";});
    return{id:ex?ex.id:gid(),sym:sym,shares:h.shares,cost:parseFloat(h.cost.toFixed(6)),
      price:ex?ex.price:0,chg:ex?ex.chg:0,div:parseFloat(h.div.toFixed(2)),
      realized:parseFloat(h.realized.toFixed(2)),note:ex?ex.note:"",fd:h.fd,acct:"FT"};
  });
  // Handle ONDS Call (option) specially
  var callEntry=S.H.filter(function(h){return h.acct==="FT"&&h.isOption;});
  S.H=S.H.filter(function(h){return h.acct&&h.acct!=="FT"&&!h.isOption;}).concat(ftHoldings).concat(callEntry);
  sv("T");sv("H");
  var cash=recalcCash();
  S.imp={rows:[],symMap:{},step:0};
  toast("✅ 匯入完成：新增 "+added+" 筆，現金 $"+fn(cash,2));
  S.tab="dash";render();
  clearTimeout(S._syncTimer);
  syncToGitHub();
}

function drawChart(p){

function render(){
  try{
    var ri=document.getElementById("ir");
    var cft=document.getElementById("ic-ft"),csw=document.getElementById("ic-sw"),cct=document.getElementById("ic-ct");
    if(ri&&document.activeElement!==ri)ri.value=S.acc.rate;
    if(cft&&document.activeElement!==cft)cft.value=S.acc.cashFT||0;
    if(csw&&document.activeElement!==csw)csw.value=S.acc.cashSchwab||0;
    if(cct&&document.activeElement!==cct)cct.value=S.acc.cashCathay||0;
    var adj=S.acc.cashAdj||{FT:0,Schwab:0,GT:0};
    var efa=document.getElementById("ic-ft-adj"),esa=document.getElementById("ic-sw-adj"),eca=document.getElementById("ic-ct-adj");
    if(efa&&document.activeElement!==efa)efa.value=adj.FT||0;
    if(esa&&document.activeElement!==esa)esa.value=adj.Schwab||0;
    if(eca&&document.activeElement!==eca)eca.value=adj.GT||0;
    document.querySelectorAll(".tab").forEach(function(b){b.classList.toggle("active",b.dataset.tab===S.tab);});
    var p=calc(),m=document.getElementById("main");
    if(S.tab==="dash")m.innerHTML=rDash(p);
    else if(S.tab==="holdings")m.innerHTML=rHoldings();
    else if(S.tab==="tx")m.innerHTML=rTx();
    else if(S.tab==="fx")m.innerHTML=rFX();
    else m.innerHTML=rSettings();
    if(S.tab==="dash")requestAnimationFrame(function(){drawChart(p);});
    if(S.editPriceId){var el=document.getElementById("ep-"+S.editPriceId);if(el){el.focus();el.select();}}
  if(S.editCostId){
    var ec=document.getElementById("ec-"+S.editCostId);
    if(ec){
      ec.focus();ec.select();
      ec.onblur=function(){saveCost(S.editCostId);};
      ec.oninput=function(){S.editCostVal=this.value;};
      ec.onkeydown=function(e){if(e.key==="Enter")saveCost(S.editCostId);else if(e.key==="Escape"){S.editCostId=null;render();}};
    }
  }
  // Event delegation for editable spans
  document.querySelectorAll(".editable").forEach(function(el){
    el.style.cursor="pointer";
    el.style.textDecoration="underline dotted";

function submitQuickTrade(){
  var qt=S.quickTrade;
  if(!qt)return;
  var h=S.H.find(function(h){return h.id===qt.id;});
  if(!h)return;
  var shares=parseFloat(document.getElementById("qt-shares").value)||0;
  var price=parseFloat(document.getElementById("qt-price").value)||0;
  var date=document.getElementById("qt-date").value||today();
  if(!shares||shares<=0){alert("請輸入股數");return;}
  if(!price||price<=0){alert("請輸入價格");return;}
  if(qt.type==="賣出"&&shares>h.shares){
    alert("賣出股數（"+shares+"）超過持有（"+h.shares+"）");return;
  }
  var fee=parseFloat(document.getElementById("qt-fee").value)||0;
  var amt=qt.type==="買入"?-(shares*price+fee):(shares*price-fee);
  var t={id:gid(),date:date,type:qt.type,sym:h.sym,shares:shares,price:price,fee:fee,amt:parseFloat(amt.toFixed(2)),wire:0,source:h.acct||"FT"};
  // Update holding
  if(qt.type==="買入"){
    var ns=h.shares+shares,nc=(h.shares*h.cost+shares*price)/ns;
    S.H=S.H.map(function(h2){return h2.id===qt.id?Object.assign({},h2,{shares:ns,cost:parseFloat(nc.toFixed(6))}):h2;});
  }else{
    var gain=(price-h.cost)*shares-fee;
    S.H=S.H.map(function(h2){return h2.id===qt.id?Object.assign({},h2,{shares:Math.max(0,h2.shares-shares),realized:parseFloat(((h2.realized||0)+gain).toFixed(2))}):h2;});
  }
  S.T.push(t);
  sv("H");sv("T");
  if(!h.acct||h.acct==="FT")recalcCash();
  S.quickTrade=null;
  toast("✅ "+(qt.type==="買入"?"買入":"賣出")+" "+h.sym+" "+shares+"股 @ $"+price);
  render();
}

// ── Transaction form helpers ──
var TX_OUT=["買入"]; // types where money goes OUT (negative amt)
var TX_IN=["賣出","入金","配息","現金利息","匯費補貼","出金"]; // positive amt

function onTxTypeChange(type){
  var sign=document.getElementById("ft-amt-sign");
  var sharesRow=document.getElementById("ft-shares")&&document.getElementById("ft-shares").closest("div");
  var priceRow=document.getElementById("ft-price")&&document.getElementById("ft-price").closest("div");
  var symRow=document.getElementById("ft-sym")&&document.getElementById("ft-sym").closest("div");
  if(sign)sign.textContent=(TX_OUT.indexOf(type)>=0?"−（支出，自動計算）":"＋（收入，自動計算）");
  // show/hide sym, shares, price based on type
  var isTrade=["買入","賣出"].indexOf(type)>=0;
  var isDiv=type==="配息";
  if(symRow)symRow.style.display=(isTrade||isDiv)?"":"none";
  if(sharesRow)sharesRow.style.display=isTrade?"":"none";
  if(priceRow)priceRow.style.display=isTrade?"":"none";
  autoCalcAmt();
}

function autoCalcAmt(){
  var type=document.getElementById("ft-type")&&document.getElementById("ft-type").value||"";
  var shares=parseFloat(document.getElementById("ft-shares")&&document.getElementById("ft-shares").value)||0;
  var price=parseFloat(document.getElementById("ft-price")&&document.getElementById("ft-price").value)||0;
  var fee=parseFloat(document.getElementById("ft-fee")&&document.getElementById("ft-fee").value)||0;
  var absInput=document.getElementById("ft-amt-abs");
  var hiddenAmt=document.getElementById("ft-amt");
  if(!hiddenAmt)return;
  var isNeg=TX_OUT.indexOf(type)>=0;
  var absVal;
  // If shares+price are filled, always auto-calc (fee changes should update amt)
  // Only use manual absInput if shares or price are missing
  if(shares>0&&price>0){
    absVal=parseFloat((shares*price+(isNeg?fee:-fee)).toFixed(2));
    if(absInput)absInput.value=absVal; // keep display in sync
  }else if(absInput&&absInput.value!==""){
    // no shares/price - trust whatever was typed manually
    absVal=parseFloat(absInput.value)||0;
  }else{
    absVal=0;
  }
  hiddenAmt.value=isNeg?-absVal:absVal;
  var sign=document.getElementById("ft-amt-sign");
  if(sign)sign.textContent=absVal>0?(isNeg?"− $"+absVal.toFixed(2)+" (支出)":"＋ $"+absVal.toFixed(2)+" (收入)"):(isNeg?"−（支出，自動計算）":"＋（收入，自動計算）");
}

function addTx(){
  var type=document.getElementById("ft-type").value;
  var sym=(document.getElementById("ft-sym").value||"").toUpperCase();
  var shares=parseFloat(document.getElementById("ft-shares").value)||0;
  var price=parseFloat(document.getElementById("ft-price").value)||0;
  autoCalcAmt(); // ensure hidden field is updated
  var rawAmt=parseFloat(document.getElementById("ft-amt").value);
  var amt=isNaN(rawAmt)?0:rawAmt;
  var source=document.getElementById("ft-source")&&document.getElementById("ft-source").value||"FT";
  var t={id:gid(),date:document.getElementById("ft-date").value,type:type,sym:sym,shares:shares,price:price,fee:parseFloat(document.getElementById("ft-fee").value)||0,amt:amt,wire:parseFloat(document.getElementById("ft-wire").value)||0,source:source};
  if(applyTx(t)===false)return;
  S.T.push(t);sv("T");
  var h=S.H.find(function(h){return h.sym===sym;});
  if(type==="買入"&&sym)toast("✅ 買入 "+sym+"，現有 "+(h?h.shares:0)+" 股");
  else if(type==="賣出"&&sym)toast("✅ 賣出 "+sym+"，剩 "+(h?h.shares:0)+" 股");
  else if(type==="配息"&&sym)toast("✅ 配息 "+sym+" 累積 $"+fn(h?h.div:0,2));
  else toast("✅ 已新增交易");
  S.showForm=null;render();
}
function renderKeepScroll(){
  var sy=window.pageYOffset||document.documentElement.scrollTop||0;
  // Lock scroll position during re-render
  document.documentElement.style.scrollBehavior="auto";
  render();
  // Restore immediately and also after paint
  window.scrollTo(0,sy);
  document.documentElement.scrollTop=sy;
  document.body.scrollTop=sy;
  requestAnimationFrame(function(){
    window.scrollTo(0,sy);
    document.documentElement.scrollTop=sy;
    setTimeout(function(){window.scrollTo(0,sy);},0);
    setTimeout(function(){window.scrollTo(0,sy);},100);
  });
}
